
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ShopEasy</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        .checkout-page {
            max-width: 650px;
            margin: 35px auto;
            padding: 25px;
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 25px;
        }

        .checkout-form input,
        .checkout-form textarea,
        .checkout-form select {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
            margin-bottom: 8px;
        }

        .checkout-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkout-form button {
            margin-top: 12px;
            cursor: pointer;
        }

        .checkout-form button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #checkoutMessage {
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .back-link {
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .checkout-page {
                margin: 15px auto;
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a class="logo" href="/">ShopEasy</a>
        <a class="back-link" href="/cart">Back to Cart</a>
    </header>

    <main class="container checkout-page">
        <h1>Checkout</h1>

        <p>Enter your delivery details to place your order.</p>

        <form id="checkoutForm" class="checkout-form">

            <label for="full_name">Full Name</label>
            <input
                id="full_name"
                name="full_name"
                type="text"
                required
                minlength="2"
                maxlength="150"
                autocomplete="name"
            >

            <label for="phone">Phone Number</label>
            <input
                id="phone"
                name="phone"
                type="tel"
                required
                minlength="10"
                maxlength="20"
                pattern="[0-9+ -]{10,20}"
                autocomplete="tel"
            >

            <label for="address">Full Address</label>
            <textarea
                id="address"
                name="address"
                required
                minlength="5"
                maxlength="1000"
                autocomplete="street-address"
            ></textarea>

            <label for="city">City</label>
            <input
                id="city"
                name="city"
                type="text"
                required
                minlength="2"
                maxlength="100"
                autocomplete="address-level2"
            >

            <label for="state">State</label>
            <input
                id="state"
                name="state"
                type="text"
                required
                minlength="2"
                maxlength="100"
                autocomplete="address-level1"
            >

            <label for="postal_code">PIN Code</label>
            <input
                id="postal_code"
                name="postal_code"
                type="text"
                required
                minlength="5"
                maxlength="10"
                pattern="[0-9]{5,10}"
                autocomplete="postal-code"
            >

            <label for="payment_method">Payment Method</label>

            <select
                id="payment_method"
                name="payment_method"
                required
            >
                <option value="COD">Cash on Delivery</option>
                <option value="RAZORPAY">
                    Online Payment (UPI / Card / Net Banking)
                </option>
            </select>

            <button
                class="shop-button"
                type="submit"
                id="placeOrderButton"
            >
                Place Order
            </button>

            <p
                id="checkoutMessage"
                role="status"
                aria-live="polite"
            ></p>

        </form>
    </main>

    <!-- Load each script only once, at the end of body -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/static/js/checkout.js"></script>
</body>
</html>
